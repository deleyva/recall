services:
  recall:
    build: .
    ports:
      - "8084:8080"
    volumes:
      - recall_data:/app/data
    environment:
      - RECALL_ENV=production
      - RECALL_PORT=8080
      - RECALL_SESSION_KEY=${RECALL_SESSION_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
    restart: unless-stopped

volumes:
  recall_data:
