openapi: "3.0.3"
info:
  title: Recall API
  description: |
    Recall is a spaced repetition app with a reading list, AI flashcard
    generation, per-article chat, playlists and podcasts.

    Every path below is registered by `api.RegisterRoutes`; `recall routes`
    prints the live table and a test diffs it against this file, so the spec
    cannot drift from the router.

    **Auth** — send `Authorization: Bearer rcl_...` (create a token on the
    Profile page or via `POST /me/tokens`). Session cookies work too, for the
    web UI. `GET /health` is the only unauthenticated endpoint besides the
    auth ones.
  version: "2.0.0"

servers:
  - url: /api/v1
    description: API v1

security:
  - BearerAuth: []

tags:
  - name: System
  - name: Auth
  - name: Account
  - name: Search
  - name: Articles
  - name: Decks
  - name: Cards
  - name: Study
  - name: Playlists
  - name: Podcasts
  - name: Stats

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "API token (format: rcl_...)"

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Message:
      type: object
      properties:
        message: { type: string }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        settings: { $ref: "#/components/schemas/Settings" }

    Settings:
      type: object
      properties:
        daily_card_limit: { type: integer, minimum: 1, maximum: 20 }
        podcast_enabled: { type: boolean }
        flashcard_gen_enabled: { type: boolean }
        flashcard_prompt: { type: string }
        readeck_url: { type: string }
        readeck_configured:
          type: boolean
          description: True when a Readeck API token is stored. The token itself is never returned.

    APIToken:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }

    Article:
      type: object
      description: Article without its stored text — the shape returned by list endpoints.
      properties:
        id: { type: string }
        user_id: { type: string }
        url: { type: string, format: uri }
        title: { type: string }
        domain: { type: string }
        created_at: { type: string, format: date-time }
        flashcard_count: { type: integer }

    ArticleDetail:
      allOf:
        - $ref: "#/components/schemas/Article"
        - type: object
          properties:
            content:
              type: string
              description: The full stored text, up to 50KB.

    Deck:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        due_count: { type: integer }

    Card:
      type: object
      properties:
        id: { type: string }
        deck_id: { type: string }
        article_id: { type: string, nullable: true }
        front: { type: string }
        back: { type: string }
        due: { type: string, format: date-time }
        stability: { type: number }
        difficulty: { type: number }
        elapsed_days: { type: integer }
        scheduled_days: { type: integer }
        reps: { type: integer }
        lapses: { type: integer }
        state:
          type: integer
          description: "FSRS state: 0 new, 1 learning, 2 review, 3 relearning"
        last_review: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CardList:
      type: object
      properties:
        cards:
          type: array
          items: { $ref: "#/components/schemas/Card" }
        total: { type: integer }

    ChatMessage:
      type: object
      properties:
        id: { type: string }
        article_id: { type: string }
        user_id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }

    SearchResult:
      type: object
      properties:
        kind: { type: string, enum: [article, flashcard, chat] }
        id: { type: string }
        title: { type: string }
        snippet:
          type: string
          description: HTML-escaped excerpt with matched terms wrapped in <mark>.
        url:
          type: string
          description: Web UI link to the matched item.
        article_id: { type: string }
        deck_id: { type: string }
        score:
          type: number
          description: bm25 relevance — lower is a better match.

    SearchResponse:
      type: object
      properties:
        query: { type: string }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }

    Playlist:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        title: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        type: { type: string, enum: [spotify, youtube] }
        external_id: { type: string }
        created_at: { type: string, format: date-time }
        articles:
          type: array
          items: { $ref: "#/components/schemas/Article" }
        decks:
          type: array
          items: { $ref: "#/components/schemas/Deck" }

    Podcast:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        title: { type: string }
        status: { type: string, enum: [pending, processing, completed, failed] }
        audio_url: { type: string }
        notebook_id: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        article_count: { type: integer }
        articles:
          type: array
          items: { $ref: "#/components/schemas/Article" }

    Stats:
      type: object
      properties:
        total_cards: { type: integer }
        due_today: { type: integer }
        streak: { type: integer }

    StudyCard:
      type: object
      properties:
        card:
          allOf: [{ $ref: "#/components/schemas/Card" }]
          nullable: true
        due_count: { type: integer }
        intervals:
          type: object
          description: Preview of the next interval per rating (1-4).

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or not owned by the caller
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  api: { type: string }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookie
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /me:
    get:
      tags: [Account]
      summary: The authenticated user and their settings
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/settings:
    put:
      tags: [Account]
      summary: Update settings
      description: Only the fields present in the body are changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                daily_card_limit: { type: integer, minimum: 1, maximum: 20 }
                podcast_enabled: { type: boolean }
                flashcard_gen_enabled: { type: boolean }
                flashcard_prompt: { type: string }
                readeck_url: { type: string }
                readeck_api_token: { type: string }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/tokens:
    get:
      tags: [Account]
      summary: List API tokens
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Account]
      summary: Create an API token
      description: The raw token is returned once and stored only as a hash.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  meta: { $ref: "#/components/schemas/APIToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/tokens/{id}:
    delete:
      tags: [Account]
      summary: Revoke an API token
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /search:
    get:
      tags: [Search]
      summary: Full-text search across every stored text
      description: |
        Searches article bodies, flashcard fronts and backs, and chat messages
        belonging to the caller. Accent- and case-insensitive; the last word is
        treated as a prefix, so search-as-you-type works. An empty or
        symbol-only query returns zero results rather than an error.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          example: canto gregoriano
        - name: kind
          in: query
          description: Comma-separated filter — article, flashcard, chat.
          schema: { type: string }
          example: article,flashcard
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Results ranked by relevance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /search/reindex:
    post:
      tags: [Search]
      summary: Rebuild the search index (admin)
      description: Triggers keep the index current; this is the repair path.
      responses:
        "200":
          description: Rebuilt
          content:
            application/json:
              schema:
                type: object
                properties:
                  indexed: { type: integer }
        "403":
          description: Admin only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /articles:
    get:
      tags: [Articles]
      summary: List saved articles
      description: Bodies are omitted here — fetch one article for its text.
      responses:
        "200":
          description: Articles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Article" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Articles]
      summary: Save an article
      description: With `content`, the text is stored as given; without it, Recall fetches the URL and extracts the text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                title: { type: string }
                content: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /articles/{id}:
    get:
      tags: [Articles]
      summary: Get one article with its stored text
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Article with content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Articles]
      summary: Update an article's title or text
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Articles]
      summary: Delete an article and its flashcards
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /articles/{id}/content:
    get:
      tags: [Articles]
      summary: Get the stored text as plain text
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The stored text
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /articles/{id}/cards:
    get:
      tags: [Articles]
      summary: Flashcards generated from this article
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardList" }
        "404": { $ref: "#/components/responses/NotFound" }

  /articles/{id}/generate:
    post:
      tags: [Articles]
      summary: Generate flashcards from the article with the LLM
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, default: 5, maximum: 20 }
      responses:
        "200":
          description: Generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: LLM not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /articles/{id}/chat:
    get:
      tags: [Articles]
      summary: Chat history for this article
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Articles]
      summary: Ask a question about the article
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "201":
          description: Question and answer, both persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { $ref: "#/components/schemas/ChatMessage" }
                  answer: { $ref: "#/components/schemas/ChatMessage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: LLM not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Articles]
      summary: Clear the chat history for this article
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /decks:
    get:
      tags: [Decks]
      summary: List decks with due counts
      responses:
        "200":
          description: Decks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Decks]
      summary: Create a deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deck" }

  /decks/{id}:
    get:
      tags: [Decks]
      summary: Get a deck
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Deck
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deck" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Decks]
      summary: Update a deck
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Decks]
      summary: Delete a deck and its cards
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /decks/{id}/cards:
    get:
      tags: [Decks]
      summary: List cards in a deck
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardList" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Decks]
      summary: Create a card in a deck
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [front, back]
              properties:
                front: { type: string }
                back: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "404": { $ref: "#/components/responses/NotFound" }

  /decks/{id}/import:
    post:
      tags: [Decks]
      summary: Bulk-import cards from CSV/TSV
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }

  /decks/{id}/study:
    get:
      tags: [Study]
      summary: Next due card in a deck
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Card to study, or null when nothing is due
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyCard" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Study]
      summary: Submit a review and get the next card
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_id, rating]
              properties:
                card_id: { type: string }
                rating:
                  type: integer
                  minimum: 1
                  maximum: 4
                  description: 1 Again, 2 Hard, 3 Good, 4 Easy
      responses:
        "200":
          description: Scheduling applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  due_count: { type: integer }
                  next_card: { $ref: "#/components/schemas/Card" }
                  intervals: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Deck not owned by the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /cards:
    get:
      tags: [Cards]
      summary: List cards across all decks
      parameters:
        - name: deck_id
          in: query
          schema: { type: string }
        - name: article_id
          in: query
          schema: { type: string }
        - name: due
          in: query
          description: "true to return only cards due now"
          schema: { type: string, enum: ["true"] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cards/{id}:
    get:
      tags: [Cards]
      summary: Get a card
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Cards]
      summary: Update a card's front and back
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                front: { type: string }
                back: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Cards]
      summary: Delete a card
