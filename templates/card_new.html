{{define "card_new.html"}}
{{template "base" .}}
{{end}}

{{define "content"}}
<h1 class="text-2xl font-bold mb-6">Add Card to {{.Deck.Name}}</h1>
<form method="POST" action="/decks/{{.Deck.ID}}/cards" class="bg-white dark:bg-gray-800 shadow rounded-lg p-6 max-w-lg space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Front</label>
        <textarea name="front" rows="3" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500"></textarea>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Back</label>
        <textarea name="back" rows="3" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500"></textarea>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">How this card is asked</label>
        <select name="kind" class="w-full border rounded-lg px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-indigo-500">
            <option value="recognition" selected>Recognition — reveal the answer and grade yourself</option>
            <option value="production">Production — type the answer before anything is revealed</option>
        </select>
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Use production for names, titles and any answer you need to be able to say unaided.</p>
    </div>
    <div class="flex gap-3">
        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Add Card</button>
        <button type="submit" name="add_another" value="true" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">Add & Continue</button>
        <a href="/decks/{{.Deck.ID}}/cards" class="px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200">Cancel</a>
    </div>
</form>
{{end}}
